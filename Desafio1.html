<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body bgcolor="black">

</body>
<script>
    const dias = Number(prompt("Digite a quantidade de dias: "));
    const km = Number(prompt("Digite a quantidade de quilometros: "));

    let valorKm;

    if (km <= 100){
        valorKm = km * 0.20;
    } else {
        valorKm = km * 0.15;
    }

    const total = dias * 90 + valorKm;

    alert("Total a pagar: R$ " + total.toFixed(2));
</script>
</html>
